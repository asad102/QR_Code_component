<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Component</title>
    <link rel="shortcut icon" href="./img/favicon-32x32.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
    <body>
        <main class="bg-Lightgray font-Outfit text-[15px] text-Darkblue  flex flex-col justify-center items-center min-h-screen box-border">
            <article class="bg-White flex flex-col justify-center items-center gap-3.5 px-[17px] py-[18px]  rounded-[15px] shadow-boxxshadow max-w-[314px]">
                <img src="./img/image-qr-code.png" alt="" class="w-full max-h-[280px] rounded-[15px]">
                <div class="flex flex-col gap-3.5 px-[15px] py-4 text-center leading-tight tracking-normal">
                    <h3 class="font-bold text-[22px] ">Improve your front-end skills by building projects</h3>
                    <p class="font-normal text-Grayishblue">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
                </div>
            </article>
        </main>
    </body>
</html>
