<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Component</title>
    <link rel="shortcut icon" href="./img/favicon-32x32.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
    <body>
        <main class="bg-Lightgray font-Outfit text-Darkblue  flex items-center min-h-screen">
            <article class="bg-White rounded-br15 shadow-boxxshadow max-w-xs mx-auto px-17 py-18 text-center flex flex-col gap-6">
                <img src="./img/image-qr-code.png" alt="" class="rounded-br15 w-imgw h-imgh">
                <h1 class="text-preset-1">Improve your front-end skills by building projects</h1>
                <p class="text-preset-2 text-Grayishblue w-[243px] mx-auto">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
            </article>
        </main>
    </body>
</html>
