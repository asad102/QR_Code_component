<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Component</title>
    <link rel="shortcut icon" href="./img/favicon-32x32.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
    <body>
        <main class="bg-Lightgray font-Outfit text-[15px] text-Darkblue  flex items-center min-h-screen">
            <article class="bg-White rounded-xl shadow-boxxshadow max-w-xs mx-auto p-4">
                <img src="./img/image-qr-code.png" alt="" class="rounded-xl">
                <div class="text-center leading-tight tracking-normal">
                    <h3 class="font-bold text-[22px] mt-6 px-1.5">Improve your front-end skills by building projects</h3>
                    <p class="font-normal text-Grayishblue mt-4 mb-6 px-3">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
                </div>
            </article>
        </main>
    </body>
</html>
