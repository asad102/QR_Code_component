<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Component</title>
    <link rel="shortcut icon" href="./img/favicon-32x32.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
    <body>
        <main class="bg-slate-300 font-Outfit text-Darkblue  flex items-center min-h-screen">
            <article class="bg-White max-w-screen-sc  mx-auto rounded-br20 shadow-boxxshadow px-200 pt-200 pb-500 text-center flex flex-col gap-300">
                    <img src="./img/image-qr-code.png" alt="qr code" class="rounded-br10 w-imgw h-imgh">
                    <div class="text flex flex-col gap-200">
                        <h1 class="text-preset-1 w-280 text-slate-900">Improve your front-end skills by building projects</h1>
                        <p class="text-preset-2 text-slate-500 w-243 mx-auto">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
                    </div>

            </article>
        </main>
    </body>
</html>
